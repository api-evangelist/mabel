name: Mabel
description: >-
  Mabel is a healthcare technology company (Irvine, California; backed by 500
  Global) that helps Medicare accountable care organizations (ACOs) enroll and
  engage beneficiaries. Its platform is a market leader in voluntary alignment,
  used by roughly one in three ACOs, and spans four core solutions: Voluntary
  Alignment (campaign execution, response processing, analytics, and compliance
  auditing for LEAD, ACO REACH, and GUIDE programs), Health Surveys (social
  determinants of health screenings, NPS, and custom surveys with CMS-formatted
  reporting), Beneficiary Notifications (compliance notices via email, mail, or
  SMS with audit-ready tracking), and Letters From Your Doctor (provider-based
  outreach for enrollment, surveys, and appointments). Mabel is HIPAA compliant
  and SOC 2 Type II certified. No public developer API or SDK surface is
  published at this time; this profile captures the company's identity,
  compliance posture, and public web properties.
